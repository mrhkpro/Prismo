<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, noarchive, nosnippet, noimageindex">
  <link rel="icon" type="image/svg+xml" href="/assets/prismo-icon.svg?v=2.8.9">
  <title>Prismo — Widget Preview</title>
  <style>
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent; }
  </style>
</head>
<body>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var widgetId = params.get("widget_id");
  if (!widgetId) return;
  var script = document.createElement("script");
  script.src = "/widget.js?v=2.8.9";
  script.async = false;
  script.setAttribute("data-widget-id", widgetId);
  script.setAttribute("data-preview", "1");
  script.setAttribute("data-api-base", location.origin);
  var theme = params.get("theme");
  script.setAttribute("data-theme", theme || "auto");
  script.setAttribute("data-language", (params.get("language") || localStorage.getItem("qz_language") || "fa").startsWith("en") ? "en" : "fa");
  document.body.appendChild(script);
}());
</script>
</body>
</html>
