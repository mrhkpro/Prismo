<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>در حال ورود به Prismo...</title>
<link rel="stylesheet" href="/assets/css/style.css?v=2.8.4">
<style>
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
  }
  .loading-card {
    text-align: center;
    padding: 32px 40px;
    background: var(--bg-glass);
    border: 1px solid var(--accent-line);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-pop);
    max-width: 400px;
    width: 90%;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--accent-soft);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-text {
    color: var(--danger);
    margin-top: 14px;
    font-size: 13.5px;
    display: none;
  }
</style>
</head>
<body>
  <div class="loading-card">
    <div class="spinner" id="spinner"></div>
    <h3 id="statusTitle">در حال دریافت اطلاعات از گوگل...</h3>
    <p id="statusDesc" style="color: var(--text-muted); font-size: 13.5px;">لطفاً چند لحظه شکیبا باشید.</p>
    <div class="error-text" id="errorText"></div>
  </div>

<script src="/assets/js/api.js?v=2.8.4"></script>
<script>
  (async function () {
    const errorText = document.getElementById("errorText");
    const spinner = document.getElementById("spinner");
    const statusTitle = document.getElementById("statusTitle");

    function showError(msg) {
      spinner.style.display = "none";
      statusTitle.textContent = "خطا در احراز هویت";
      errorText.textContent = msg;
      errorText.style.display = "block";
      setTimeout(() => {
        location.href = "/";
      }, 3000);
    }

    try {
      let accessToken = "";
      const hash = window.location.hash.substring(1);
      const hashParams = new URLSearchParams(hash);
      if (hashParams.has("access_token")) {
        accessToken = hashParams.get("access_token");
      } else {
        const queryParams = new URLSearchParams(window.location.search);
        if (queryParams.has("access_token")) {
          accessToken = queryParams.get("access_token");
        }
      }

      if (!accessToken) {
        showError("توکن احراز هویت گوگل یافت نشد.");
        return;
      }
      // The Supabase access token arrives in the URL fragment. Remove it from
      // browser history before making the application-session exchange.
      history.replaceState({}, document.title, window.location.pathname + window.location.search);

      const data = await apiCall("/api/auth/google-supabase", {
        method: "POST",
        auth: false,
        body: { supabase_token: accessToken }
      });

      if (data && data.access_token) {
        Auth.setToken(data.access_token);
        location.href = "/dashboard.html";
      } else {
        showError("خطا در صدور توکن نشست پریزمو.");
      }
    } catch (err) {
      showError(err.message || "خطا در ارتباط با سرور.");
    }
  })();
</script>
</body>
</html>
