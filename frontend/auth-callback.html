<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>در حال ورود به Prismo...</title>
<link rel="stylesheet" href="/assets/css/style.css?v=2.8.9">
<style>
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
  }
  .loading-card {
    text-align: center;
    padding: 32px 40px;
    background: var(--bg-glass);
    border: 1px solid var(--accent-line);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-pop);
    max-width: 400px;
    width: 90%;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid var(--accent-soft);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-text {
    color: var(--danger);
    margin-top: 14px;
    font-size: 13.5px;
    display: none;
  }
</style>
</head>
<body>
  <div class="loading-card">
    <div class="spinner" id="spinner"></div>
    <h3 id="statusTitle">در حال دریافت اطلاعات از گوگل...</h3>
    <p id="statusDesc" style="color: var(--text-muted); font-size: 13.5px;">لطفاً چند لحظه شکیبا باشید.</p>
    <div class="error-text" id="errorText"></div>
  </div>

<script src="/assets/js/api.js?v=2.8.9"></script>
<script>
  (async function () {
    const errorText = document.getElementById("errorText");
    const spinner = document.getElementById("spinner");
    const statusTitle = document.getElementById("statusTitle");
    const statusDesc = document.getElementById("statusDesc");

    function showError(msg) {
      spinner.style.display = "none";
      statusTitle.textContent = "خطا در احراز هویت";
      statusDesc.textContent = "آدرس بازگشت و تنظیمات Supabase را بررسی کنید و دوباره تلاش کنید.";
      errorText.textContent = msg;
      errorText.style.display = "block";
      setTimeout(() => { location.replace("/"); }, 5000);
    }

    // Remove all one-time callback parameters before any network request.
    // Modern sign-in accepts only PKCE authorization codes, never bearer tokens
    // returned in the URL fragment/query. Supabase and Google tokens are not stored here.
    const callbackUrl = new URL(window.location.href);
    const authCode = callbackUrl.searchParams.get("code");
    const oauthError = callbackUrl.searchParams.get("error_description") || callbackUrl.searchParams.get("error");
    const hashParams = new URLSearchParams(callbackUrl.hash.replace(/^#/, ""));
    const returnedBearerToken = ["access_token", "refresh_token", "provider_token"].some((name) =>
      callbackUrl.searchParams.has(name) || hashParams.has(name)
    );
    history.replaceState({}, document.title, callbackUrl.pathname);

    try {
      if (oauthError) {
        sessionStorage.removeItem("prismo_google_pkce_verifier");
        sessionStorage.removeItem("prismo_google_pkce_redirect_uri");
        sessionStorage.removeItem("prismo_google_pkce_started_at");
        showError("ورود گوگل لغو شد یا Supabase بازگشت را نپذیرفت: " + oauthError);
        return;
      }
      if (returnedBearerToken) {
        throw new Error("Supabase به‌جای کد امن PKCE توکن را در آدرس برگرداند. تنظیمات OAuth را اصلاح کنید و دوباره تلاش کنید.");
      }

      let data;
      if (authCode) {
        const verifier = sessionStorage.getItem("prismo_google_pkce_verifier");
        const expectedRedirect = sessionStorage.getItem("prismo_google_pkce_redirect_uri");
        const startedAt = Number(sessionStorage.getItem("prismo_google_pkce_started_at") || 0);
        const actualRedirect = `${window.location.origin}${window.location.pathname}`;
        if (!verifier || !expectedRedirect || expectedRedirect !== actualRedirect) {
          throw new Error("کد ورود به همان مرورگری که ورود را شروع کرده متصل نیست؛ از سایت اصلی دوباره ورود را آغاز کنید.");
        }
        if (!startedAt || Date.now() - startedAt > 10 * 60 * 1000) {
          throw new Error("مهلت ورود تمام شده است؛ دوباره ورود با گوگل را شروع کنید.");
        }
        sessionStorage.removeItem("prismo_google_pkce_verifier");
        sessionStorage.removeItem("prismo_google_pkce_redirect_uri");
        sessionStorage.removeItem("prismo_google_pkce_started_at");
        data = await apiCall("/api/auth/google-pkce", {
          method: "POST",
          auth: false,
          body: { auth_code: authCode, code_verifier: verifier }
        });
      } else {
        throw new Error("کد امن بازگشت Google OAuth پیدا نشد. تنظیم Redirect URL در Supabase را بررسی کنید.");
      }

      if (data && data.access_token) {
        Auth.setToken(data.access_token);
        statusTitle.textContent = "ورود موفق بود";
        statusDesc.textContent = "در حال انتقال به داشبورد…";
        location.replace("/dashboard.html");
      } else {
        throw new Error("توکن نشست Prismo صادر نشد.");
      }
    } catch (err) {
      sessionStorage.removeItem("prismo_google_pkce_verifier");
      sessionStorage.removeItem("prismo_google_pkce_redirect_uri");
      sessionStorage.removeItem("prismo_google_pkce_started_at");
      showError(err.message || "ورود امن گوگل ناموفق بود.");
    }
  })();
</script>
</body>
</html>
