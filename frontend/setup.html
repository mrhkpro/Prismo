<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, noarchive, nosnippet, noimageindex">
  <link rel="icon" type="image/svg+xml" href="/assets/prismo-icon.svg?v=2.7.7">
  <title>راه‌اندازی Prismo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
  <style>
    :root{color-scheme:dark;--bg:#0f1623;--panel:#1a2332;--panel2:#141d2b;--border:rgba(255,255,255,.09);--text:#e6ebf2;--muted:#aeb7c6;--faint:#7f8a9d;--accent:#1abb9c;--accent2:#169f85;--blue:#066fd1;--shadow:0 28px 80px rgba(0,0,0,.42)}
    *{box-sizing:border-box}
    ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(179,188,203,.25);border:2px solid transparent;background-clip:padding-box;border-radius:999px}::-webkit-scrollbar-thumb:hover{background:rgba(26,187,156,.55);background-clip:padding-box}html{scrollbar-width:thin;scrollbar-color:rgba(179,188,203,.32) transparent}
    html,body{margin:0;min-height:100%;font-family:'Vazirmatn',Tahoma,Arial,sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:28px;direction:rtl;color:var(--text);background:
      radial-gradient(900px 520px at 92% -8%,rgba(26,187,156,.13),transparent 62%),
      radial-gradient(760px 480px at 8% 0%,rgba(245,159,0,.08),transparent 60%),
      linear-gradient(145deg,#0b111c 0%,#101827 50%,#0e1521 100%);
      -webkit-font-smoothing:antialiased}
    .setup-wrap{width:min(820px,100%)}
    .setup-card{position:relative;overflow:hidden;background:rgba(26,35,50,.96);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:42px}
    .setup-card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--accent));opacity:.95}
    .setup-card:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;left:-140px;bottom:-170px;background:radial-gradient(circle,rgba(26,187,156,.13),transparent 68%);pointer-events:none}
    .setup-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:30px}
    .setup-mark{width:54px;height:54px;flex:0 0 54px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0f1623;font-weight:900;font-size:22px;box-shadow:0 12px 28px rgba(26,187,156,.24)}
    .eyebrow{font-size:11px;letter-spacing:.12em;color:#80dec9;font-weight:800;margin-bottom:7px}
    .setup-title{font-size:29px;line-height:1.35;margin:0 0 7px;font-weight:800;letter-spacing:-.02em}
    .setup-sub{margin:0;color:var(--muted);line-height:1.9;font-size:14px;max-width:690px}
    .setup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .setup-option{position:relative;min-height:190px;border:1px solid var(--border);background:linear-gradient(180deg,rgba(20,29,43,.96),rgba(15,22,35,.96));color:var(--text);border-radius:14px;padding:24px;text-align:right;cursor:pointer;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;background-clip:padding-box}
    .setup-option:hover{transform:translateY(-3px);border-color:rgba(26,187,156,.42);box-shadow:0 18px 36px -24px rgba(26,187,156,.52)}
    .setup-option:focus-visible{outline:3px solid rgba(26,187,156,.22);outline-offset:3px}
    .setup-icon{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;background:rgba(26,187,156,.10);color:#7ce4d1;margin-bottom:17px}
    .setup-option strong{display:block;font-size:17px;margin-bottom:8px}.setup-option span{display:block;color:var(--muted);line-height:1.85;font-size:13px}
    .setup-badge{position:absolute;left:18px;top:18px;padding:4px 8px;border-radius:999px;background:rgba(6,111,209,.12);border:1px solid rgba(6,111,209,.22);color:#81bdf3;font-size:10px;font-weight:800}
    .setup-status{min-height:27px;margin-top:18px;color:var(--muted);font-size:13px}.setup-status.error{color:#ff8b8b}.setup-status.ok{color:#7ee2a8}
    .setup-foot{margin-top:26px;padding-top:17px;border-top:1px solid var(--border);color:var(--faint);font-size:12px;line-height:1.8}
    .setup-option:disabled{opacity:.6;cursor:wait;transform:none}
    @media(max-width:700px){body{padding:15px}.setup-card{padding:24px;border-radius:15px}.setup-head{margin-bottom:24px}.setup-title{font-size:23px}.setup-grid{grid-template-columns:1fr}.setup-option{min-height:150px}}
  </style>
</head>
<body>
  <main class="setup-wrap">
    <section class="setup-card" aria-labelledby="setupTitle">
      <div class="setup-head">
        <div class="setup-mark prismo-setup-mark"><img src="/assets/prismo-icon.svg?v=2.7.7" alt="" aria-hidden="true"></div>
        <div>
          <div class="eyebrow">PRISMO • SETUP</div>
      <h1 class="setup-title" id="setupTitle">Prismo را چطور اجرا کنیم؟</h1>
      <p class="setup-sub" id="setupSub">برای این اجرا یکی را انتخاب کن. این صفحه فقط از طریق <b>setup.bat</b> نمایش داده می‌شود و اجرای عادی سایت دیگر این سؤال را نشان نمی‌دهد.</p>
        </div>
      </div>
      <div class="setup-grid" id="setupOptions">
        <button class="setup-option" type="button" data-mode="local">
          <span class="setup-icon" aria-hidden="true">▣</span>
          <span class="setup-badge">سریع‌ترین حالت</span>
          <strong>کاملاً لوکال</strong>
          <span>SQLite داخلی، بدون Supabase و مناسب اجرای سریع روی همین سیستم. داده‌ها روی همین پروژه باقی می‌مانند.</span>
        </button>
        <button class="setup-option" type="button" data-mode="supabase">
          <span class="setup-icon" aria-hidden="true">☁</span>
          <span class="setup-badge">ابری</span>
          <strong>Supabase</strong>
          <span>PostgreSQL / Supabase با تنظیمات قبلی پروژه، مناسب اجرای ابری یا اتصال مستقیم به دیتابیس مشترک.</span>
        </button>
      </div>
      <div class="setup-status" id="setupStatus" aria-live="polite"></div>
      <div class="setup-foot">در Vercel این صفحه وارد چرخه اجرای برنامه نمی‌شود و انتخاب دیتابیس از طریق Environment Variables پروژه انجام می‌شود.</div>
    </section>
  </main>
  <script src="/assets/js/settings.js?v=2.7.7"></script>
  <script>
  (async function () {
    const status = document.getElementById('setupStatus');
    const lang = () => (localStorage.getItem('qz_language') || 'fa').startsWith('en') ? 'en' : 'fa';
    const options = document.getElementById('setupOptions');
    try {
      const runtime = await fetch('/api/runtime', {headers:{Accept:'application/json','X-QZ-Language':lang()}}).then(r => r.ok ? r.json() : null);
      if (runtime && runtime.vercel) {
        document.getElementById('setupTitle').textContent = 'این نسخه روی Vercel اجرا می‌شود';
        document.getElementById('setupSub').textContent = 'انتخاب دیتابیس در Vercel از متغیرهای محیطی انجام می‌شود؛ این صفحه نباید برای اجرای عادی نمایش داده شود.';
        options.style.display = 'none';
        status.textContent = 'در حال انتقال به صفحه اصلی…';
        setTimeout(() => location.href = '/', 700);
        return;
      }
    } catch (_) {}

    options.querySelectorAll('[data-mode]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const mode = btn.dataset.mode;
        options.querySelectorAll('button').forEach(b => b.disabled = true);
        status.className = 'setup-status';
        status.textContent = mode === 'local' ? 'در حال تنظیم اجرای کاملاً لوکال…' : 'در حال تنظیم اتصال Supabase…';
        try {
          const response = await fetch('/__setup/choose', {
            method: 'POST',
            headers: {'Content-Type':'application/json','Accept':'application/json','X-QZ-Language':lang()},
            body: JSON.stringify({mode})
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.detail || 'تنظیمات ذخیره نشد.');
          status.className = 'setup-status ok';
          status.textContent = mode === 'supabase' ? 'Supabase انتخاب شد. در حال بررسی آماده‌شدن سرور…' : 'حالت لوکال انتخاب شد. در حال اجرای Prismo…';
          let attempts = 0;
          const waitForApp = async () => {
            attempts += 1;
            try {
              const app = await fetch('http://127.0.0.1:8000/api/runtime', { cache: 'no-store', headers: {'Accept':'application/json','X-QZ-Language':lang()} });
              if (app.ok) { location.href = 'http://127.0.0.1:8000/'; return; }
            } catch (_) {}
            try {
              const boot = await fetch('/__setup/status', {cache:'no-store'}).then(r => r.json());
              if (boot.state === 'failed') {
                throw new Error(boot.detail || 'برنامه اصلی اجرا نشد.');
              }
            } catch (bootErr) {
              if (bootErr && bootErr.message) {
                status.className = 'setup-status error';
                status.textContent = bootErr.message;
                options.querySelectorAll('button').forEach(b => b.disabled = false);
                return;
              }
            }
            if (attempts < 40) setTimeout(waitForApp, 500);
            else {
              status.className = 'setup-status error';
              status.textContent = 'راه‌اندازی بیشتر از حد معمول طول کشید. فایل data/prismo-startup.log را بررسی کن.';
              options.querySelectorAll('button').forEach(b => b.disabled = false);
            }
          };
          waitForApp();
        } catch (err) {
          status.className = 'setup-status error';
          status.textContent = err.message || 'خطا در تنظیم پروژه.';
          options.querySelectorAll('button').forEach(b => b.disabled = false);
        }
      });
    });
  })();
  </script>
</body>
</html>
